    query: 'site:my.indeed.com "Director Operations" OR "Head of Operations" OR "Operations Director" Malaysia'
    enabled: true

  - name: Indeed Malaysia — Facilities Management
    query: 'site:my.indeed.com "Facilities Management" OR "Building Management" OR "O&M Manager" Malaysia senior'
