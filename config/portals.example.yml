# Portal Scanner Configuration
# Used by /career-ops scan to discover new offers automatically.
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Operations & Facilities Management (Primary target) --
    - "Operations Manager"
    - "Maintenance Manager"
    - "Facilities Manager"
    - "Facilities Management"
    - "Building Manager"
    - "Property Manager"
    - "Estate Manager"
    - "Asset Manager"
    - "Facility Operations"
    - "O&M Manager"
    - "Site Manager"
    - "Project Manager"
    - "Construction Manager"
    - "Infrastructure Manager"
    # -- Technical Program & Digital Transformation --
    - "Technical Program Manager"
    - "Programme Manager"
    - "Program Manager"
    - "Digital Transformation"
    - "Transformation Manager"
    - "IT Project Manager"
    - "Technology Manager"
    - "ERP Manager"
    - "CRM Manager"
    - "Systems Manager"
    # -- Director / Head / Senior Leadership --
    - "Director of Operations"
    - "Head of Operations"
    - "Head of Facilities"
    - "Head of Maintenance"
    - "General Manager"
    - "Country Manager"
    - "VP Operations"
    # -- AI-enabled Operations (Unique angle) --
    - "AI"
    - "Automation"
    - "Smart Building"
    - "PropTech"
    - "Intelligent Building"
    - "CAFM"
    - "CMMS"
  negative:
    - "Junior"
    - "Intern"
    - "Graduate"
    - "Entry Level"
    - "iOS"
    - "Android"
    - "Embedded"
    - "Firmware"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Accountant"
    - "Cleaner"
    - "Technician"
    - "Electrician"
    - "Plumber"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Head"
    - "Director"
    - "GM"
    - "VP"
    - "Chief"
    - "Principal"

# -- Search queries --
# Malaysia-focused operations, facilities, technical program management roles

search_queries:

  # -- JobStreet Malaysia (primary job board) --
  - name: JobStreet — Senior Operations Manager Malaysia
    query: 'site:my.jobstreet.com "Operations Manager" OR "Senior Operations Manager" Malaysia'
    enabled: true

  - name: JobStreet — Facilities & Maintenance Manager Malaysia
    query: 'site:my.jobstreet.com "Facilities Manager" OR "Maintenance Manager" OR "Building Manager" Malaysia senior'
    enabled: true

  - name: JobStreet — Technical Program Manager Malaysia
    query: 'site:my.jobstreet.com "Technical Program Manager" OR "Programme Manager" OR "Project Director" Malaysia'
    enabled: true

  - name: JobStreet — Digital Transformation Malaysia
    query: 'site:my.jobstreet.com "Digital Transformation" OR "Head of Operations" OR "Director of Operations" Malaysia'
    enabled: true

  - name: JobStreet — Head of Facilities Malaysia
    query: 'site:my.jobstreet.com "Head of Facilities" OR "GM Facilities" OR "VP Operations" Malaysia'
    enabled: true

  # -- LinkedIn Malaysia --
  - name: LinkedIn — Senior Operations Manager Malaysia
    query: 'site:linkedin.com/jobs "Senior Operations Manager" OR "Head of Operations" Malaysia'
    enabled: true

  - name: LinkedIn — Facilities Management Malaysia
    query: 'site:linkedin.com/jobs "Facilities Manager" OR "Maintenance Manager" OR "Estate Manager" Kuala Lumpur OR Malaysia'
    enabled: true

  - name: LinkedIn — Technical Program Manager Malaysia
    query: 'site:linkedin.com/jobs "Technical Program Manager" OR "Programme Manager" Malaysia'
    enabled: true

  - name: LinkedIn — General Manager Operations Malaysia
    query: 'site:linkedin.com/jobs "General Manager" OR "Country Manager" operations Malaysia relocation'
    enabled: true

  - name: LinkedIn — PropTech & Smart Building Malaysia
    query: 'site:linkedin.com/jobs "PropTech" OR "Smart Building" OR "Intelligent Building" OR "AI" facilities Malaysia'
    enabled: true

  # -- Indeed Malaysia --
